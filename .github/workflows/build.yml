name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  msvc:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: BedrockQoL-msvc
          path: |
            build/Release/BedrockQoL.dll
            build/Release/BedrockQoLLauncher.exe

  mingw:
    name: MinGW + tests (Wine)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          # Mesa: OpenGL (wined3d, Direct3D 11) and lavapipe Vulkan (vkd3d, Direct3D 12) under Xvfb.
          sudo apt-get install -y --no-install-recommends mingw-w64 wine64 ninja-build xvfb xauth \
            libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Build
        run: |
          VERSION="${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          cmake -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake -DBEDROCKQOL_VERSION="$VERSION"
          cmake --build build
          # Two extra builds with fixed versions for the auto-update test.
          for v in 1 2; do
            cmake -B build-v$v -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake -DBEDROCKQOL_VERSION=test-$v
            cmake --build build-v$v --target BedrockQoL
          done
      - name: DLL test (fake game, Direct3D 11)
        working-directory: build
        env:
          WINEDEBUG: -all
        run: |
          /usr/lib/wine/wine64 wineboot -i || true
          # Let the Wine session started without a display end, so the test gets one with Xvfb.
          /usr/lib/wine/wineserver -w
          xvfb-run -a /usr/lib/wine/wine64 fake_game.exe BedrockQoL.dll
      - name: DLL test (fake game, Direct3D 12)
        working-directory: build
        env:
          WINEDEBUG: -all
        run: |
          /usr/lib/wine/wineserver -w
          xvfb-run -a /usr/lib/wine/wine64 fake_game.exe BedrockQoL.dll --d3d12
      - name: Launcher / auto-update test
        run: tests/launcher_test.sh build build-v1/BedrockQoL.dll build-v2/BedrockQoL.dll
      - uses: actions/upload-artifact@v4
        with:
          name: BedrockQoL-mingw
          path: |
            build/BedrockQoL.dll
            build/BedrockQoL.map
            build/BedrockQoLLauncher.exe

  # The launcher downloads release "latest" (manifest.txt + BedrockQoL.dll) and reloads the new DLL
  # into the running game, so every push to main reaches players automatically. "Run workflow" by
  # hand publishes the chosen branch.
  release:
    name: Publish "latest" release
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    needs: [msvc, mingw]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BedrockQoL-mingw
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          cd dist
          printf 'version=%s\nfile=BedrockQoL.dll\nsha256=%s\n' "$VERSION" "$(sha256sum BedrockQoL.dll | cut -d' ' -f1)" > manifest.txt
          cat manifest.txt
          gh release delete latest --yes --cleanup-tag || true
          # BedrockQoL.map decodes "CRASH: ... BedrockQoL.dll+0x..." lines of the log for this build.
          gh release create latest BedrockQoL.dll BedrockQoLLauncher.exe manifest.txt BedrockQoL.map \
            --target "$GITHUB_SHA" --latest \
            --title "BedrockQoL $VERSION" \
            --notes "Сборка из ветки ${GITHUB_REF_NAME}, коммит $GITHUB_SHA. BedrockQoLLauncher.exe скачивает её сам."
